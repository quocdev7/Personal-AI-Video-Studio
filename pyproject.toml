[project]
name = "personal-ai-studio"
version = "0.1.0"
description = "Ứng dụng desktop cá nhân, local-first: phụ đề, chia video, xử lý âm thanh, dịch và lồng tiếng."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.8.3",
    "psutil>=6.0,<8",
]

[project.optional-dependencies]
# Module B (video -> phụ đề). Cài khi bắt đầu Giai đoạn 3.
asr = [
    "faster-whisper>=1.1,<2",
]
vietsub = [
    "rapidocr-onnxruntime==1.4.4",
]
# Kiểm duyệt (che khỏa thân / bạo lực / chữ thô tục): NudeNet (MIT) — chỉ dùng file mô hình ONNX đi kèm, chạy bằng
# onnxruntime (MIT); Pillow (MIT-CMU) để đổi kích thước ảnh. Mô hình CLIP (MIT) tải riêng khi người dùng đồng ý.
safety = [
    "nudenet==3.4.2",
    "onnxruntime>=1.17",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[project.scripts]
personal-ai-studio = "pas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: test cần FFmpeg/ffprobe thật trên máy",
    "ollama: test gọi Ollama thật trên máy (chậm, chỉ chạy khi đặt PAS_TEST_OLLAMA=1)",
]

[tool.uv]
# nudenet kéo theo opencv-python-headless, trùng thư mục cv2 với opencv-python của RapidOCR (cài cả hai làm hỏng
# cv2). Ứng dụng không dùng cv2 cho NudeNet nên bỏ gói headless.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]
