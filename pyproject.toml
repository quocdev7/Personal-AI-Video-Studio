[project]
name = "personal-ai-studio"
version = "0.1.0"
description = "Ứng dụng desktop cá nhân, local-first: phụ đề, chia video, xử lý âm thanh, dịch và lồng tiếng."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.8.3",
    "psutil>=6.0,<8",
]

[project.optional-dependencies]
# Module B (video -> phụ đề). Cài khi bắt đầu Giai đoạn 3.
asr = [
    "faster-whisper>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[project.scripts]
personal-ai-studio = "pas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: test cần FFmpeg/ffprobe thật trên máy",
]
