[project]
name = "personal-ai-studio"
version = "0.1.0"
description = "Ứng dụng desktop cá nhân, local-first: phụ đề, chia video, xử lý âm thanh, dịch và lồng tiếng."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.8.3",
    "psutil>=6.0,<8",
]

[project.optional-dependencies]
# Nhận dạng giọng nói (Làm lại video: lấy transcript). faster-whisper MIT; mô hình tải riêng khi người dùng đồng ý.
asr = [
    "faster-whisper>=1.1,<2",
]
# Giọng đọc tiếng Việt: Piper (GPL-3.0-or-later, kèm espeak-ng) — đã được người dùng chấp thuận; giọng tải riêng.
# VieNeu-TTS v3 Turbo (Apache-2.0): giọng có sẵn + nhân bản giọng từ file mẫu, chạy ONNX trên CPU; mô hình tải riêng.
tts = [
    "piper-tts==1.8.0",
    "vieneu==3.8.3",
]
vietsub = [
    "rapidocr-onnxruntime==1.4.4",
]
# Làm lại video (đủ 4 bước): nhận dạng giọng nói + giọng đọc + OCR chữ cũ + Pillow (MIT-CMU) vẽ thumbnail.
remake = [
    "personal-ai-studio[asr,tts,vietsub]",
    "pillow>=10",
]
# Phim ngắn AI: tạo ảnh bằng OpenVINO GenAI (Apache-2.0, chạy CPU Intel, không cần torch); mô hình ảnh tải riêng
# khi người dùng đồng ý. Giọng Anh dùng Piper (nhóm tts), lời thoại do Ollama viết, Pillow kiểm tra ảnh.
aifilm = [
    "personal-ai-studio[tts]",
    "openvino-genai==2026.4.1.0",
    "pillow>=10",
]
# Kiểm duyệt (che khỏa thân / bạo lực / chữ thô tục): NudeNet (MIT) — chỉ dùng file mô hình ONNX đi kèm, chạy bằng
# onnxruntime (MIT); Pillow (MIT-CMU) để đổi kích thước ảnh. Mô hình CLIP (MIT) tải riêng khi người dùng đồng ý.
safety = [
    "nudenet==3.4.2",
    "onnxruntime>=1.17",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[project.scripts]
personal-ai-studio = "pas.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: test cần FFmpeg/ffprobe thật trên máy",
    "ollama: test gọi Ollama thật trên máy (chậm, chỉ chạy khi đặt PAS_TEST_OLLAMA=1)",
]

[tool.uv]
# nudenet kéo theo opencv-python-headless, trùng thư mục cv2 với opencv-python của RapidOCR (cài cả hai làm hỏng
# cv2). Ứng dụng không dùng cv2 cho NudeNet nên bỏ gói headless.
# vieneu khai báo bắt buộc gradio (chỉ dùng cho giao diện web demo) và librosa (có đường dự phòng soundfile + soxr);
# ứng dụng không dùng hai gói đó nên bỏ để khỏi kéo thêm hàng trăm MB.
override-dependencies = [
    "opencv-python-headless; sys_platform == 'never'",
    "gradio; sys_platform == 'never'",
    "librosa; sys_platform == 'never'",
]
